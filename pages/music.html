  <script>async function loadComponent(id,url){try{const r=await fetch(url);if(!r.ok)throw new Error('Component unavailable');document.getElementById(id).innerHTML=await r.text();if(window.KamoSite)window.KamoSite.hydrateSiteConfig(document.getElementById(id));if(window.KamoUtils){window.KamoUtils.initMobileNav();window.KamoUtils.setActiveNavLink();}}catch(e){console.warn(e.message,url);}}loadComponent('navbar','/components/navbar.html');loadComponent('sidebar','/components/sidebar.html');loadComponent('footer','/components/footer.html');</script>
